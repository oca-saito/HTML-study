<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML基礎レッスン</title>
  </head>
  <body>
    <!-- Step 1: 見出しを書いてみよう -->
    <h1>齊藤之喜</h1>

    <!-- Step 2: ここに <h2> と <p> を追加しよう -->
    <div>
      <h2>はじめまして</h2>
      <p>私の名前は齊藤之喜です。Web制作の勉強をしています。</p>
      <p>趣味でバスケの審判をやってます。</p>

      <p>好きな食べ物</p>
      <p>オムライスが大好きです</p>
    </div>

    <!-- Step 3: ここに <ul> または <ol> のリストを追加しよう -->
    <div>
      <h2>趣味リスト</h2>
      <ul>
        <li>バスケの審判</li>
        <li>パソコン作業</li>
        <li>音楽鑑賞</li>
      </ul>

      <h2>好きな食べ物ランキング</h2>
      <ol>
        <li>オムライス</li>
        <li>お寿司</li>
        <li>ハンバーグ</li>
      </ol>
    </div>
    <!-- Step 4: ここに <a> リンクと <img> 画像を追加しよう -->
    <h2>リンク</h2>
    <p><a href="https://nextcrew.jp">NextCrew公式ウェブサイト</a></p>

    <h2>画像</h2>
    <img src="https://via.placeholder.com/300x200" alt="サンプル画像" />

    <!-- Step 5: <div> でグループ化してみよう -->
  </body>
</html>
